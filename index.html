<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-title" content="우루루사's 웹게임">
  <meta name="application-name" content="우루루사's 웹게임">
  <title>우루루사's 웹게임</title>
  <meta name="description" content="핸드폰으로 바로 하는 작은 웹게임들">
  <meta property="og:title" content="우루루사's 웹게임">
  <meta property="og:description" content="핸드폰으로 바로 하는 작은 웹게임들">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hub">
    <header>
      <nav class="langs" id="langs" aria-label="Language">
        <button type="button" data-lang="ko" lang="ko" aria-label="한국어" title="한국어"></button>
        <button type="button" data-lang="en" lang="en" aria-label="English" title="English"></button>
        <button type="button" data-lang="ja" lang="ja" aria-label="日本語" title="日本語"></button>
      </nav>
      <div class="head-row">
        <h1 data-t="title">우루루사's 웹게임</h1>
        <button id="install" class="install" hidden data-t-aria="installAria" aria-label="핸드폰에 앱으로 설치 (전체 화면)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3M10 18.5h4"/></svg>
          <span data-t="install">설치</span>
        </button>
      </div>
      <p class="sub" data-t="sub">핸드폰으로 바로 하는 작은 웹게임들</p>
    </header>
    <div id="games" class="games"></div>
    <noscript><p class="sub">게임 목록을 보려면 자바스크립트를 켜 주세요. / Please enable JavaScript to see the games. / ゲーム一覧を見るにはJavaScriptを有効にしてください。</p></noscript>
  </main>

  <script src="flags.js"></script>
  <script src="games.js"></script>
  <script>
    (function () {
      // 언어: ① 주소 ?lang= → ② 저장된 선택(woomars.lang, 모든 게임과 같이 씀) → ③ 브라우저 언어(ko·ja 외에는 영어)
      var LANGS = ['ko', 'en', 'ja'];
      var KEY = 'woomars.lang';
      var UI = {
        ko: { title: "우루루사's 웹게임", app: "우루루사's 웹게임", manifest: '/manifest.webmanifest', sub: '핸드폰으로 바로 하는 작은 웹게임들', install: '설치', installAria: '핸드폰에 앱으로 설치 (전체 화면)',
          goal: '목표', rules: '간단 룰', play: '하러 가기', wip: '개발 중', go: ' 하러 가기', preview: ' (개발 중) 미리 보기', shot: ' 첫 화면', locale: 'ko-KR' },
        en: { title: "WooRuRuSa's Web Games", app: "WooRuRuSa's Web Games", manifest: '/manifest.en.webmanifest', sub: 'Small web games you can play right on your phone', install: 'Install', installAria: 'Install as an app on your phone (full screen)',
          goal: 'Goal', rules: 'Quick rules', play: 'Play', wip: 'In development', go: ': play', preview: ' (in development): preview', shot: ' start screen', locale: 'en-US' },
        ja: { title: 'ウルルサのウェブゲーム', app: 'ウルルサのウェブゲーム', manifest: '/manifest.ja.webmanifest', sub: 'スマホですぐ遊べる小さなウェブゲーム', install: 'インストール', installAria: 'スマホにアプリとしてインストール（全画面）',
          goal: '目標', rules: 'かんたんルール', play: 'プレイ', wip: '開発中', go: 'をプレイ', preview: '（開発中）プレビュー', shot: 'のスタート画面', locale: 'ja-JP' },
      };
      function save(l) { try { localStorage.setItem(KEY, l); } catch (e) { /* 저장 안 되는 창 */ } }
      function pickLang() {
        var q = /[?&]lang=(ko|en|ja)(?:&|$)/.exec(location.search);
        if (q) { save(q[1]); return q[1]; }
        try { var s = localStorage.getItem(KEY); if (LANGS.indexOf(s) >= 0) return s; } catch (e) { /* 저장 안 되는 창 */ }
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        return /^ko/i.test(nav) ? 'ko' : /^ja/i.test(nav) ? 'ja' : 'en';
      }
      var lang = pickLang();
      Array.prototype.forEach.call(document.querySelectorAll('#langs button'), function (b) { b.innerHTML = LANG_FLAGS[b.getAttribute('data-lang')]; });

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // 카운터 키 = 게임 주소의 첫 칸(https://woomars.github.io/yeogiyo/ → yeogiyo)
      var playsEl = {};
      var counts = null;
      function gameKey(g) { return g.url.split('/')[3]; }

      function card(g) {
        var u = UI[lang];
        var tx = gameText(g, lang);
        var a = el('a', g.wip ? 'gcard wip' : 'gcard');
        a.href = g.url;
        a.setAttribute('aria-label', tx.title + (g.wip ? u.preview : u.go));

        var shot = el('div', 'shot');
        var img = el('img');
        img.src = 'shots/' + g.id + (lang === 'ko' ? '' : '.' + lang) + '.webp';
        img.onerror = function () { img.onerror = null; img.src = 'shots/' + g.id + '.webp'; }; // 그 언어 스크린샷이 없으면 한국어
        img.alt = tx.title + u.shot;
        img.width = 390;
        img.height = 844;
        img.loading = 'lazy';
        shot.appendChild(img);

        var info = el('div', 'info');
        info.appendChild(el('h2', null, tx.title));
        info.appendChild(el('p', 'pitch', tx.pitch));
        info.appendChild(el('div', 'lbl', u.goal));
        info.appendChild(el('p', 'goal', tx.goal));
        info.appendChild(el('div', 'lbl', u.rules));
        var ol = el('ol', 'rules');
        tx.rules.forEach(function (r) { ol.appendChild(el('li', null, r)); });
        info.appendChild(ol);
        var chips = el('div', 'chips');
        tx.tags.forEach(function (t) { chips.appendChild(el('span', 'chip', t)); });
        info.appendChild(chips);
        info.appendChild(el('span', 'play', g.wip ? u.wip : u.play));

        a.appendChild(shot);
        a.appendChild(info);
        var plays = el('span', 'plays'); // 오른쪽 위 모서리에 숫자만(주인 확인용)
        plays.hidden = true;
        playsEl[gameKey(g)] = plays;
        a.appendChild(plays);
        return a;
      }

      function showCounts() {
        if (!counts) return;
        Object.keys(playsEl).forEach(function (k) {
          var n = Number(counts[k]);
          if (n > 0) {
            playsEl[k].textContent = n.toLocaleString(UI[lang].locale);
            playsEl[k].hidden = false;
          }
        });
      }

      var box = document.getElementById('games');
      function render() {
        var u = UI[lang];
        document.documentElement.lang = lang;
        document.title = u.title;
        // 핸드폰에 설치할 때의 앱 이름도 지금 언어로(설치 뒤에 언어를 바꿔도 이미 설치된 이름은 그대로)
        document.querySelector('link[rel="manifest"]').setAttribute('href', u.manifest);
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', u.app);
        document.querySelector('meta[name="application-name"]').setAttribute('content', u.app);
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (n) { n.textContent = u[n.getAttribute('data-t')]; });
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-aria]'), function (n) { n.setAttribute('aria-label', u[n.getAttribute('data-t-aria')]); });
        Array.prototype.forEach.call(document.querySelectorAll('#langs button'), function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
        });
        box.textContent = '';
        playsEl = {};
        GAMES.forEach(function (g) { box.appendChild(card(g)); });
        showCounts();
      }
      render();

      document.getElementById('langs').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-lang]');
        if (!b || b.getAttribute('data-lang') === lang) return;
        lang = b.getAttribute('data-lang');
        save(lang); // 게임들도 같은 저장값(woomars.lang)을 읽어 이 언어로 열린다
        render();
      });

      // 게임별 플레이 수(각 게임의 count.js가 기기당 하루 한 번 센다). 못 받으면 아무것도 안 보인다.
      if (typeof fetch === 'function') {
        fetch('https://woomars-counter.vercel.app/api/plays')
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (c) { counts = c || {}; showCounts(); })
          .catch(function () {});
      }

      // 앱으로 설치하면 메뉴와 모든 게임이 같은 전체 화면 창에서 열린다(사이트 전체가 앱 범위).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      }
      var installBtn = document.getElementById('install');
      var deferred = null;
      var inApp = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        if (!inApp) installBtn.hidden = false;
      });
      installBtn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; installBtn.hidden = true; });
      });
      window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
    })();
  </script>
</body>
</html>
